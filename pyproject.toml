[project]
name = "object-tracker"
version = "0.1.0"
description = "Detect and track any object in video with a swappable detector backend (YOLO today) + optional sliced inference (SAHI technique), saving an annotated video and a detections sidecar."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "supervision>=0.25.0,<0.30",  # annotators only now (ADR-0012); <0.30 kept conservatively (bump not grilled)
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.scripts]
track = "object_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["object_tracker"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
