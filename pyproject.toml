[project]
name = "yolo-bytetrack-sot"
version = "0.1.0"
description = "Detect small flying birds in video with YOLO + sliced inference (SAHI technique), saving an annotated video and a detections sidecar."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "supervision>=0.25.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.scripts]
detect-birds = "detect_birds:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["detect_birds.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
