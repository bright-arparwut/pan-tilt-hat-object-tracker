[project]
name = "object-tracker-sandbox"
version = "0.1.0"
description = "Learning sandbox: re-implement the object-tracker pipeline from an empty skeleton over 12 weeks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "supervision>=0.25.0,<0.30",
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "lap>=0.5.12",
]

[project.scripts]
track = "object_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["object_tracker"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
