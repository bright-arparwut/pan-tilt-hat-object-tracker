[project]
name = "turret-pi-sandbox"
version = "0.1.0"
description = "Learning sandbox: the Pi-side actuator (servo driver, frame streamer, command listener). Runs on the Raspberry Pi only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",  # camera capture + MJPEG encode; cross-platform, so Mac tests can import it
]

[project.optional-dependencies]
# Pi-only actuator stack: PCA9685 over I²C, speaking degrees. Pulls in adafruit-blinka, which
# only runs on the Pi — install it there with: uv sync --extra hardware. The ServoDriver import
# is lazy, so Mac tests pass without this extra present. That is the whole trick.
hardware = [
    "adafruit-circuitpython-servokit",
]

[project.scripts]
turret = "turret_pi.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turret_pi"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
